<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ניהול שיעורים</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --text-color: #333;
            --sidebar-bg: #2c3e50;
            --sidebar-text: #fff;
            --btn-bg: #34495e;
            --btn-hover: #1abc9c;
            --btn-active: #16a085;
            --header-bg: #2c3e50;
        }

        body.dark-mode {
            --bg-color: #121212;
            --text-color: #ffffff;
            --sidebar-bg: #1e1e1e;
            --sidebar-text: #ffffff;
            --btn-bg: #2d2d2d;
            --btn-hover: #00adb5;
            --btn-active: #007e85;
            --header-bg: #1e1e1e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            height: 100vh;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow: hidden;
            transition: background-color 0.3s, color 0.3s;
            padding-top: 45px; /* מרווח לפס העליון הקבוע */
        }

        #lesson-topbar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 45px;
            background-color: var(--header-bg);
            color: #fff;
            padding: 0 15px;
            display: flex;
            align-items: center;
            justify-content: flex-end; /* ממקם את כפתור החזרה לקורסים בצד שמאל בתצוגת RTL */
            z-index: 20;
        }

        .top-back-to-courses-btn {
            background-color: var(--btn-bg);
            color: #fff;
            border: none;
            padding: 5px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: background-color 0.2s;
        }

        .top-back-to-courses-btn:hover {
            background-color: var(--btn-hover);
        }

        #lessons-sidebar {
            width: 260px;
            background-color: var(--sidebar-bg);
            color: var(--sidebar-text);
            padding: 20px 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: -2px 0 5px rgba(0,0,0,0.1);
            transition: background-color 0.3s;
            overflow-y: auto;
            max-height: calc(100vh - 45px);
        }

        #lessons-sidebar.hidden {
            display: none;
        }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid rgba(255,255,255,0.1);
            padding-bottom: 10px;
            margin-bottom: 10px;
        }

        .sidebar-header h2 {
            font-size: 1.1rem;
        }

        .lesson-btn {
            background-color: var(--btn-bg);
            color: var(--sidebar-text);
            border: none;
            padding: 12px 15px;
            border-radius: 6px;
            cursor: pointer;
            text-align: right;
            font-size: 1rem;
            transition: background-color 0.2s;
            flex-shrink: 0;
        }

        .lesson-btn:hover {
            background-color: var(--btn-hover);
        }

        #main-view {
            flex: 1;
            height: calc(100vh - 45px);
            position: relative;
            padding: 20px;
            overflow-y: auto;
        }

        #lesson-content-frame {
            width: 100%;
            height: 100%;
            border: none;
            background: transparent;
        }

        .notice-box {
            background-color: rgba(255, 193, 7, 0.15);
            color: var(--text-color);
            border: 1px solid #ffeeba;
            padding: 20px;
            border-radius: 8px;
            font-size: 1.1rem;
            text-align: center;
        }

        /* כפתור חזרה לרשימת השיעורים שיופיע בתוך פאנל השיעור או בראשו כשצריך */
        .back-to-lessons-bar {
            margin-bottom: 15px;
        }

        .back-to-lessons-btn {
            background-color: var(--btn-bg, #34495e);
            color: #fff;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: background-color 0.2s;
        }

        .back-to-lessons-btn:hover {
            background-color: var(--btn-hover, #1abc9c);
        }
    </style>
</head>
<body>

    <header id="lesson-topbar">
        <!-- כפתור חזרה קבוע למערכת ניהול קורסים בצד שמאל למעלה -->
        <button class="top-back-to-courses-btn" id="top-back-courses-btn">⬅ חזרה למערכת ניהול קורסים</button>
    </header>

    <aside id="lessons-sidebar">
        <div class="sidebar-header">
            <h2>תפריט שיעורים בהסתברות כללית</h2>
            <!-- החץ הכחול הוסר לחלוטין לבקשתך -->
        </div>
    </aside>

    <main id="main-view">
        <h2 style="margin-top: 10px;">בחר שיעור מהתפריט</h2>
    </main>

    <script>
        const availableLessons = [1];
        const TOTAL_LESSONS = 1;

        const lessonsSidebar = document.getElementById('lessons-sidebar');
        const mainView = document.getElementById('main-view');
        const topBackCoursesBtn = document.getElementById('top-back-courses-btn');

        let currentIsDark = false;

        if (window.parent) {
            window.parent.postMessage({ type: 'REQUEST_THEME' }, '*');
        }

        for (let i = 1; i <= TOTAL_LESSONS; i++) {
            const button = document.createElement('button');
            button.className = 'lesson-btn';
            button.innerText = `שיעור מס' ${i}`;
            button.onclick = () => openLesson(i);
            lessonsSidebar.appendChild(button);
        }

        function sendThemeToSubIframe() {
            const innerFrame = document.getElementById('lesson-content-frame');
            if (innerFrame && innerFrame.contentWindow) {
                innerFrame.contentWindow.postMessage({ type: 'SET_THEME', isDark: currentIsDark }, '*');
            }
        }

        function openLesson(lessonNum) {
            lessonsSidebar.classList.add('hidden');

            if (availableLessons.includes(lessonNum)) {
                const filePath = lessonNum === 1 ? 'L1/lesson1.html' : `lesson${lessonNum}.html`;
                
                // הוספת כפתור חזרה לרשימת השיעורים מעל ה-iframe
                mainView.innerHTML = `
                    <div class="back-to-lessons-bar">
                        <button class="back-to-lessons-btn" onclick="backToLessonsList()">➔ חזרה לרשימת השיעורים</button>
                    </div>
                    <iframe id="lesson-content-frame" src="${filePath}" style="height: calc(100% - 45px);"></iframe>
                `;

                const innerFrame = document.getElementById('lesson-content-frame');
                innerFrame.onload = () => {
                    sendThemeToSubIframe();
                };
            } else {
                mainView.innerHTML = `
                    <div class="back-to-lessons-bar">
                        <button class="back-to-lessons-btn" onclick="backToLessonsList()">➔ חזרה לרשימת השיעורים</button>
                    </div>
                    <div class="notice-box">
                        <h3>עדיין לא עודכן שיעור ${lessonNum}</h3>
                        <p style="margin-top: 8px;">התוכן לשיעור זה ייעלה בהמשך.</p>
                    </div>
                `;
            }
        }

        function backToLessonsList() {
            lessonsSidebar.classList.remove('hidden');
            mainView.innerHTML = `<h2 style="margin-top: 10px;">בחר שיעור מהתפריט</h2>`;
        }

        topBackCoursesBtn.onclick = () => {
            if (window.parent) {
                window.parent.postMessage({ type: 'GO_BACK_TO_TOPICS' }, '*');
            }
        };

        window.addEventListener('message', (event) => {
            if (event.data && event.data.type === 'SET_THEME') {
                currentIsDark = event.data.isDark;
                document.body.classList.toggle('dark-mode', currentIsDark);
                sendThemeToSubIframe();
            }
            if (event.data && event.data.type === 'REQUEST_THEME') {
                sendThemeToSubIframe();
            }
            // אפשרות להאזנה לבקשה מבפנים לחזור לרשימת השיעורים
            if (event.data && event.data.type === 'GO_BACK_TO_LESSONS') {
                backToLessonsList();
            }
        });
    </script>
</body>
</html>
